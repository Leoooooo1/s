<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Werewolf — หมาป่า</title>
<style>
:root{--bg:#14131c;--card:#1f1d2b;--line:#34314a;--tx:#ece6d8;--mu:#9b97b0;--ac:#b3342b;--v:#6fb1d8;--w:#e8833a;--n:#c39bd3}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 50% -10%,#2a2640,var(--bg) 60%) fixed;color:var(--tx);font-family:system-ui,"Noto Sans Thai",sans-serif;line-height:1.5}
#app{max-width:560px;margin:auto;padding:16px 16px 40px}
h1,h2{margin:.3em 0;font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:12px 0}
button{display:block;width:100%;background:var(--ac);color:#fff;border:0;border-radius:10px;padding:13px 16px;font-size:1rem;margin:8px 0;font-family:inherit}
button:active{filter:brightness(1.2)}
button.s{background:#34314a}
button.sm{width:auto;padding:6px 14px;margin:0}
input,textarea,select{width:100%;background:var(--bg);color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:10px;font-size:1rem;font-family:inherit}
input[type=checkbox]{width:auto}
label{display:block;margin:8px 0;color:var(--mu);font-size:.9rem}
label input[type=checkbox]{margin-right:8px}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1}
.big{font-size:4rem;text-align:center;line-height:1.2}
.c{text-align:center}
.mu{color:var(--mu);font-size:.9rem}
.t-v{color:var(--v)}.t-w{color:var(--w)}.t-n{color:var(--n)}
.tg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tg button{margin:0}
.dead{opacity:.45;text-decoration:line-through}
.num{min-width:1.6em;text-align:center;font-weight:700;flex:0 0 auto}
.rb{flex:0 0 auto}
@media (prefers-reduced-motion:no-preference){.big{animation:f .5s ease-out}@keyframes f{from{opacity:0;transform:scale(.8)}}}
</style>
</head>
<body>
<div id="app"></div>
<script src="client.js"></script>
</body></html>
